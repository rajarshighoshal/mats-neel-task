<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Paired source-swap experiment</title><desc id="desc">The same problem is shown with the reasoning and direct-answer directives swapped between REQUEST and WORKING NOTES. The model scores reasoning versus direct mode, and the difference is compared across post-training stages.</desc><rect width="1000" height="500" rx="18" fill="#ffffff"/><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:25px;font-weight:700;fill:#0f172a}.subtitle{font-size:14px;fill:#475569}.card-title{font-size:14px;font-weight:700;fill:#0f172a}.label{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#64748b}.body{font-size:13px;fill:#1e293b}.formula{font-size:16px;font-weight:650;fill:#0f172a}.note{font-size:12px;fill:#475569}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs><text class="title" x="50" y="44">Paired source-swap design</text><text class="subtitle" x="50" y="70">The problem and directive wording stay fixed; only the source carrying each directive changes.</text><rect x="50" y="100" width="390" height="216" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="card-title" x="70" y="128">request_cue</text><rect x="70" y="145" width="350" height="58" rx="9" fill="#dbeafe"/><text class="label" x="84" y="166">REQUEST</text><text class="body" x="84" y="188">Reason step by step</text><rect x="70" y="218" width="350" height="58" rx="9" fill="#f1f5f9"/><text class="label" x="84" y="239">WORKING NOTES</text><text class="body" x="84" y="261">Answer directly</text><text class="note" x="70" y="298">Score S = reason logit − direct logit</text><rect x="560" y="100" width="390" height="216" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="card-title" x="580" y="128">notes_cue</text><rect x="580" y="145" width="350" height="58" rx="9" fill="#f1f5f9"/><text class="label" x="594" y="166">REQUEST</text><text class="body" x="594" y="188">Answer directly</text><rect x="580" y="218" width="350" height="58" rx="9" fill="#dbeafe"/><text class="label" x="594" y="239">WORKING NOTES</text><text class="body" x="594" y="261">Reason step by step</text><text class="note" x="580" y="298">Score S = reason logit − direct logit</text><line x1="245" y1="316" x2="390" y2="362" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="755" y1="316" x2="610" y2="362" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="300" y="350" width="400" height="108" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text class="formula" x="500" y="386" text-anchor="middle">ψ(stage) = mean[S(notes_cue) − S(request_cue)]</text><text class="formula" x="500" y="418" text-anchor="middle">Θ = ψ(RLVR) − ψ(Base)</text><text class="note" x="500" y="444" text-anchor="middle">Negative Θ means post-training increased REQUEST dominance.</text></svg>
