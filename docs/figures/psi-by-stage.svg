<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Stagewise reasoning-cue source contrast</title><desc id="desc">The contrast is near zero at Base and SFT, becomes strongly negative at DPO, and remains negative at RLVR.</desc><metadata>confirmation_summary_sha256=d8237ca0d8192672e1a288716768fbac134dc66e0b40ef79179a53bdd94f5d39</metadata><rect width="960" height="560" rx="18" fill="#ffffff"/><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:25px;font-weight:700;fill:#0f172a}.subtitle{font-size:14px;fill:#475569}.axis{font-size:12px;fill:#64748b}.stage{font-size:14px;font-weight:650;fill:#1e293b}.value{font-size:14px;font-weight:700;fill:#0f172a}.note{font-size:12px;fill:#475569}.callout{font-size:12px;font-weight:650;fill:#5b21b6}</style><text id="title" class="title" x="48" y="46">Stagewise reasoning-cue source contrast</text><text class="subtitle" x="48" y="72">Tulu 3 8B · GSM8K · negative ψ means stronger REQUEST control</text><rect x="346" y="126" width="313" height="316" rx="12" fill="#f5f3ff"/><line x1="112" y1="154.7" x2="900" y2="154.7" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 5"/><text class="axis" x="96" y="158.7" text-anchor="end">0.00</text><line x1="112" y1="212.2" x2="900" y2="212.2" stroke="#e2e8f0" stroke-width="1"/><text class="axis" x="96" y="216.2" text-anchor="end">−0.50</text><line x1="112" y1="269.6" x2="900" y2="269.6" stroke="#e2e8f0" stroke-width="1"/><text class="axis" x="96" y="273.6" text-anchor="end">−1.00</text><line x1="112" y1="327.1" x2="900" y2="327.1" stroke="#e2e8f0" stroke-width="1"/><text class="axis" x="96" y="331.1" text-anchor="end">−1.50</text><line x1="112" y1="384.5" x2="900" y2="384.5" stroke="#e2e8f0" stroke-width="1"/><text class="axis" x="96" y="388.5" text-anchor="end">−2.00</text><line x1="112" y1="442.0" x2="900" y2="442.0" stroke="#e2e8f0" stroke-width="1"/><text class="axis" x="96" y="446.0" text-anchor="end">−2.50</text><text class="axis" x="28" y="284.0" text-anchor="middle" transform="rotate(-90 28 284.0)">ψ = S(notes cue) − S(request cue)</text><text class="callout" x="502.5" y="108" text-anchor="middle">largest observed stagewise shift</text><line x1="408" y1="116" x2="597" y2="116" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/></marker></defs><polyline points="165,157.4 390,179.1 615,401.8 840,347.4" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="165" cy="157.4" r="8" fill="#64748b" stroke="#ffffff" stroke-width="3"/><text class="value" x="165" y="139.4" text-anchor="middle">−0.02</text><text class="stage" x="165" y="474" text-anchor="middle">Base</text><circle cx="390" cy="179.1" r="8" fill="#0ea5e9" stroke="#ffffff" stroke-width="3"/><text class="value" x="390" y="161.1" text-anchor="middle">−0.21</text><text class="stage" x="390" y="474" text-anchor="middle">SFT</text><circle cx="615" cy="401.8" r="8" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><text class="value" x="615" y="383.8" text-anchor="middle">−2.15</text><text class="stage" x="615" y="474" text-anchor="middle">DPO</text><circle cx="840" cy="347.4" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text class="value" x="840" y="329.4" text-anchor="middle">−1.68</text><text class="stage" x="840" y="474" text-anchor="middle">RLVR</text><text class="note" x="112" y="516">Each point averages 1,319 items and both block orders. Stage localization is exploratory.</text><text class="note" x="900" y="516" text-anchor="end">More REQUEST dominance ↓</text></svg>
